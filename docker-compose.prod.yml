version: "3.9"

# Production overrides — apply with:
# docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  mysql:
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes

  minio:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G

  backend:
    restart: always
    command: >
      sh -c "
        alembic upgrade head &&
        python seed.py &&
        gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --timeout 60 --keepalive 5 --access-logfile - --error-logfile -
      "
    environment:
      ENVIRONMENT: production
      OTP_STUB_MODE: "false"
    deploy:
      resources:
        limits:
          memory: 1G
    volumes: []  # Remove volume mount in production — use image only

  celery_worker:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    restart: always

  nginx:
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro

volumes:
  certbot_www:
  certbot_conf:
