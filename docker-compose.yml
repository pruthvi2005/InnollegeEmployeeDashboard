version: "3.9"

services:
  # ─── Database ─────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: jyohar_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jyohar_db}
      MYSQL_USER: ${MYSQL_USER:-jyohar}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-jyohar_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - jyohar_net

  # ─── Cache / Message Broker ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: jyohar_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_pass} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jyohar_net

  # ─── Object Storage (S3-compatible) ───────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: jyohar_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - jyohar_net

  # ─── MinIO bucket initializer ─────────────────────────────────────────────
  minio_init:
    image: minio/mc:latest
    container_name: jyohar_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin123};
      mc mb --ignore-existing myminio/${MINIO_BUCKET:-jyohar-files};
      mc anonymous set private myminio/${MINIO_BUCKET:-jyohar-files};
      echo 'MinIO bucket ready.';
      exit 0;
      "
    networks:
      - jyohar_net

  # ─── FastAPI Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jyohar_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-jyohar}:${MYSQL_PASSWORD:-jyohar_pass}@mysql:3306/${MYSQL_DATABASE:-jyohar_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-use-32-chars-minimum}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-jyohar-files}
      MINIO_SECURE: "false"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      OTP_STUB_MODE: ${OTP_STUB_MODE:-true}
      MSG91_API_KEY: ${MSG91_API_KEY:-}
      MSG91_TEMPLATE_ID: ${MSG91_TEMPLATE_ID:-}
      MSG91_OTP_VARIABLE: ${MSG91_OTP_VARIABLE:-VAR1}
      MSG91_COUNTRY_CODE: ${MSG91_COUNTRY_CODE:-91}
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000","http://localhost:80","http://localhost"]'
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "
        alembic upgrade head &&
        python seed.py &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    networks:
      - jyohar_net

  # ─── Celery Worker ─────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jyohar_celery
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-jyohar}:${MYSQL_PASSWORD:-jyohar_pass}@mysql:3306/${MYSQL_DATABASE:-jyohar_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-use-32-chars-minimum}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-jyohar-files}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      - backend
      - redis
      - mysql
    command: celery -A app.workers.celery_app worker -B -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app
    networks:
      - jyohar_net

  # ─── React Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jyohar_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - jyohar_net

  # ─── Nginx Reverse Proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: jyohar_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - jyohar_net

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  jyohar_net:
    driver: bridge
